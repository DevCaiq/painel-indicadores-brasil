[project]
name = "painel-indicadores-brasil"
version = "0.1.0"
description = "Painel em português para a API de indicadores do Brasil"
requires-python = ">=3.12,<3.13"
dependencies = ["fastapi", "uvicorn", "jinja2", "httpx", "pydantic-settings", "tzdata"]

[dependency-groups]
dev = ["pytest", "ruff", "mypy"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/painel_indicadores"]

[tool.hatch.build.targets.wheel.force-include]
"src/painel_indicadores/estaticos" = "painel_indicadores/estaticos"

[tool.pytest.ini_options]
testpaths = ["testes"]

[tool.ruff]
target-version = "py312"
extend-exclude = [".agents"]

[tool.mypy]
python_version = "3.12"
strict = true
